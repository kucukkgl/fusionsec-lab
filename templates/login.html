<h1>Login</h1>

{% if message %}
    <p>{{ message }}</p>
{% endif %}

<form action="/pentest/login" method="post">

    Username:
    <input type="text" name="username">

    <br><br>

    Password:
    <input type="password" name="password">

    <br><br>

    <button type="submit">Login</button>

</form>

<p>New here? <a href="/pentest/signup">Create an account</a></p>
